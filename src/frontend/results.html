<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Results — Dicom Anonymization Tool</title>
  <link rel="stylesheet" href="assets/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body data-show-logout="true" data-page="results">
  <div id="sharedHeader"></div>

  <main class="page-container">

    <div class="page-header">
      <h2>Processing Results</h2>
      <p class="page-subtitle" id="pageSubtitle">Anonymization pipeline complete.</p>
    </div>

    <!-- Meta strip -->
    <div class="results-meta-strip" id="metaStrip"></div>

    <!-- Single unified download -->
    <div class="download-all-wrap">
      <button id="downloadAllBtn" class="btn btn-primary btn-lg" onclick="downloadAll()">
        <i class="fas fa-file-archive"></i> Download All (.zip)
      </button>
      <p class="download-all-note">
        <i class="fas fa-info-circle"></i>
        One zip with anonymized DICOM, NIfTI, PDF, and FHIR files, organized as
        <code>Anonymized_data_&lt;timestamp&gt;/Patient_&lt;id&gt;/Study_&lt;id&gt;/{dicom,nifti,pdf,fhir}</code>
      </p>
      <div id="downloadError" class="download-all-error" style="display:none;"></div>
    </div>

    <!-- Result cards — one per patient -->
    <div id="resultCardList"></div>

    <!-- Bottom CTA -->
    <div style="text-align:center; margin-top:2rem;">
      <a href="upload.html" class="btn btn-primary btn-lg">
        <i class="fas fa-plus"></i> Process Another Scan
      </a>
    </div>

  </main>

  <div id="sharedFooter"></div>

  <script src="assets/script.js"></script>
  <script>
    requireAuth();

    const raw = sessionStorage.getItem('pipelineResult');
    if (!raw) window.location.replace('upload.html');

    // Always an array of per-patient results — the single-patient flow
    // wraps its one result in a 1-item array so this page only needs one
    // code path regardless of how many patients were processed.
    let results = JSON.parse(raw || '[]');
    if (!Array.isArray(results)) results = [results];

    // ── Meta strip ──
    (function buildMeta() {
      const doneCount  = results.filter(r => r.status === 'done').length;
      const errorCount = results.filter(r => r.status === 'error').length;

      const items = [
        { key: 'Patients',  val: String(results.length) },
        { key: 'Completed', val: String(doneCount) },
      ];
      if (errorCount > 0) items.push({ key: 'Failed', val: String(errorCount) });
      items.push({ key: 'Processed at', val: fmtTimestamp(results[0] && results[0].timestamp) });

      document.getElementById('metaStrip').innerHTML = items.map(i => `
        <div class="results-meta-item">
          <span class="results-meta-key">${i.key}</span>
          <span class="results-meta-val">${escapeHtml(i.val)}</span>
        </div>
      `).join('');

      if (results.length > 1) {
        document.getElementById('pageSubtitle').textContent =
          `Anonymization pipeline complete for ${results.length} patients — ${doneCount} succeeded` +
          (errorCount > 0 ? `, ${errorCount} failed` : '') + '.';
      }

      if (doneCount === 0) {
        document.getElementById('downloadAllBtn').disabled = true;
      }
    })();

    // ── Single unified download (zip) ──
    async function downloadAll() {
      const doneJobs = results.filter(r => r.status === 'done' && r.jobId);
      const errorEl  = document.getElementById('downloadError');
      const btn      = document.getElementById('downloadAllBtn');
      errorEl.style.display = 'none';

      if (doneJobs.length === 0) return;

      const originalHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Preparing download…';

      try {
        // A real browser navigation (GET, not fetch()+response.blob())
        // so the download streams straight to disk. A multi-patient
        // export can run into the hundreds of MB to several GB —
        // buffering all of that into a JS Blob before it can be saved
        // is exactly what produces a browser-side "Failed to fetch"
        // (net::ERR_FAILED) that has nothing to do with the server,
        // which built and sent a perfectly complete response either
        // way. Opened in a new tab so a genuine error response (e.g. a
        // job whose state was lost after a server restart) is visible
        // there instead of silently replacing this results page.
        const params = new URLSearchParams();
        doneJobs.forEach(r => params.append('job_ids', r.jobId));

        const a = document.createElement('a');
        a.href = `${API_BASE}/export?${params.toString()}`;
        a.target = '_blank';
        a.rel = 'noopener';
        document.body.appendChild(a);
        a.click();
        a.remove();
      } catch (err) {
        errorEl.textContent = 'Download failed: ' + err.message;
        errorEl.style.display = 'block';
      } finally {
        setTimeout(() => {
          btn.disabled = false;
          btn.innerHTML = originalHtml;
        }, 1500);
      }
    }

    // ── Result cards ──
    async function buildCards() {
      const container = document.getElementById('resultCardList');
      container.innerHTML = '';
      for (let idx = 0; idx < results.length; idx++) {
        const wrap = document.createElement('div');
        container.appendChild(wrap);
        await buildOneCard(wrap, results[idx], idx);
      }
    }

    async function buildOneCard(container, item, idx) {
      const label = item.patientName || item.patientId || item.jobId || ('Patient ' + (idx + 1));

      // ── Failed job — short error card, nothing else to show ──
      if (item.status === 'error') {
        container.innerHTML = `
          <div class="result-scan-card">
            <div class="result-scan-card-header">
              <i class="fas fa-exclamation-triangle" style="color:var(--red);"></i>
              ${escapeHtml(label)} &mdash; <span style="color:var(--red);">Failed</span>
            </div>
            <div class="result-scan-card-body">
              <p style="color:var(--red); font-size:0.85rem;">
                ${escapeHtml(item.error || 'Pipeline failed — check server logs for details.')}
              </p>
            </div>
          </div>`;
        return;
      }

      const outputs = item.outputs || {};
      const jobId   = item.jobId;

      // ── Readiness row — a completed job means every stage succeeded ──
      const readinessRow = `
        <div class="readiness-row">
          ${['DICOM', 'NIfTI', 'PDF', 'FHIR'].map(name => `
            <span class="readiness-item"><i class="fas fa-check-circle"></i> ${name}</span>
          `).join('')}
        </div>`;

      // ── PII comparison — fetch the audit report for this job ──
      let piiCompareHtml = '<p style="color:var(--text-muted);font-size:0.85rem;">PII audit not available.</p>';
      if (outputs.pii_audit_url) {
        try {
          const res = await fetch(API_BASE + outputs.pii_audit_url);
          const audit = await res.json();
          piiCompareHtml = renderPiiCompare(audit);
        } catch {
          piiCompareHtml = '<p style="color:var(--text-muted);font-size:0.85rem;">Could not load PII audit.</p>';
        }
      }

      container.innerHTML = `
        <div class="result-scan-card">
          <div class="result-scan-card-header">
            <i class="fas fa-x-ray"></i>
            ${escapeHtml(label)} &mdash; <span style="font-family:var(--font-mono); font-size:0.85rem;">${escapeHtml(jobId || '')}</span>
          </div>
          <div class="result-scan-card-body">

            <div>
              <div class="result-sub-label"><i class="fas fa-check-double"></i> Outputs Ready</div>
              ${readinessRow}
            </div>

            <div>
              <div class="result-sub-label"><i class="fas fa-user-shield"></i> PII Before vs After</div>
              ${piiCompareHtml}
            </div>

            <div>
              <div class="result-sub-label"><i class="fas fa-shield-alt"></i> Anonymization Summary</div>
              <div style="display:flex;flex-direction:column;gap:0.4rem;">
                ${[
                  ['PII tags wiped', 'DICOM PS3.15 Annex E — 50+ tags cleared'],
                  ['UIDs remapped', 'Deterministic SHA-256 remap — 2.25 OID arc'],
                  ['Nested sequences', 'Recursive walk — all depths covered'],
                  ['Pixel scrubbing', 'EasyOCR — burned-in text detected and zeroed'],
                  ['PDF redacted', 'openai/privacy-filter — PII spans replaced'],
                  ['FHIR standard', 'HL7 R4 — ABDM compliant'],
                ].map(([k,v]) => `
                  <div style="display:flex;gap:0.6rem;align-items:flex-start;padding:0.5rem 0.75rem;background:var(--bg-input);border:1px solid var(--border);border-radius:6px;font-size:0.82rem;">
                    <i class="fas fa-check-circle" style="color:var(--green);margin-top:0.15rem;flex-shrink:0;"></i>
                    <div>
                      <span style="font-weight:600;">${k}</span>
                      <span style="color:var(--text-muted);margin-left:0.4rem;">${v}</span>
                    </div>
                  </div>`).join('')}
              </div>
            </div>

          </div>
        </div>`;
    }

    // ── PII comparison rendering — two side-by-side panels ──
    function piiRowsHtml(entries, which) {
      return entries.map(e => {
        const val = which === 'original' ? e.original : e.anonymized;
        const display = (val && String(val).trim()) ? val : (which === 'anonymized' ? '(removed)' : '—');
        const actionClass = which === 'anonymized' ? (' pii-action-' + e.action) : '';
        return `
          <div class="pii-row">
            <span class="pii-field-name">${escapeHtml(e.label)}</span>
            <span class="pii-field-value${actionClass}">${escapeHtml(String(display))}</span>
          </div>`;
      }).join('');
    }

    function renderPiiCompare(audit) {
      const dicomEntries = (audit.dicom || []).map(e => ({ label: e.name, original: e.original, anonymized: e.anonymized, action: e.action }));
      const pdfEntries    = (audit.pdf   || []).map(e => ({ label: e.label, original: e.original, anonymized: e.anonymized, action: e.action }));

      if (dicomEntries.length === 0 && pdfEntries.length === 0) {
        return '<p style="color:var(--text-muted);font-size:0.85rem;">No PII fields were found to compare.</p>';
      }

      function panel(which, title, icon) {
        let body = '';
        if (dicomEntries.length > 0) {
          body += '<div class="pii-subheader">DICOM Tags</div>' + piiRowsHtml(dicomEntries, which);
        }
        if (pdfEntries.length > 0) {
          body += '<div class="pii-subheader">PDF Report Fields</div>' + piiRowsHtml(pdfEntries, which);
        }
        return `
          <div class="pii-compare-panel pii-${which}">
            <div class="pii-compare-title"><i class="fas fa-${icon}"></i> ${title}</div>
            <div class="pii-compare-body">${body}</div>
          </div>`;
      }

      return `
        <div class="pii-compare-wrap">
          ${panel('original', 'Original (before anonymization)', 'eye')}
          ${panel('anonymized', 'Anonymized (PII removed)', 'shield-alt')}
        </div>`;
    }

    buildCards();
  </script>
</body>
</html>
